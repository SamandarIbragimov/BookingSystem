name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main  # or your default branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3️⃣ Install frontend dependencies
      - name: Install dependencies
        run: |
          cd booking-frontend
          npm ci

      # 4️⃣ Build Angular app (production)
      - name: Build Angular app
        run: |
          cd booking-frontend
          npm run build -- --configuration production

      # 5️⃣ Disable Jekyll
      - name: Disable Jekyll
        run: echo "" > booking-frontend/dist/booking-frontend/.nojekyll

      # 6️⃣ Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages          # Target branch
          folder: booking-frontend/dist/booking-frontend  # Angular build output
          clean: true               # Remove old files before deploy
